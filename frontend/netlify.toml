[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers are defined in next.config.js (headers()).
# Required environment variables on Netlify:
#   NEXT_PUBLIC_API_URL = https://<your-backend>.onrender.com   (proxy target, socket, uploads)
